<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Liberata Metrics Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
  <aside class="sidebar">
    <p class="eyebrow">Liberata</p>
    <h1>Metrics Explorer</h1>
    <p class="lede">GitHub Pages demo. The browser builds a toy corpus and computes the metrics shown here in JavaScript. This is a second implementation, not the Python <code>liberata_metrics</code> library. For the real library, run <code>python -m website.app</code>.</p>

    <form id="corpus-form">
      <fieldset>
        <legend>Academic papers</legend>
        <label>Manuscripts <output id="out-manuscripts">50</output>
          <input id="num-manuscripts" type="range" min="12" max="100" step="1" value="50" />
        </label>
        <label>Contributors <output id="out-contributors">80</output>
          <input id="num-contributors" type="range" min="16" max="140" step="1" value="80" />
        </label>
        <label>Citation density <output id="out-density">0.40</output>
          <input id="citation-density" type="range" min="0.1" max="0.9" step="0.05" value="0.4" />
        </label>
        <label>Credit inequality <output id="out-inequality">High</output>
          <input id="credit-inequality" type="range" min="0" max="100" step="1" value="80" />
        </label>
        <label>Retraction rate <output id="out-retract">5%</output>
          <input id="retraction-rate" type="range" min="0" max="0.2" step="0.01" value="0.05" />
        </label>
        <label>Random seed
          <input id="seed" type="number" value="105" />
        </label>
      </fieldset>
    </form>

    <fieldset>
      <legend>View</legend>
      <label>Portfolio subset
        <select id="subset-mode">
          <option value="all" selected>All contributors</option>
          <option value="top_n">Top N by capital</option>
          <option value="single">Single scholar</option>
        </select>
      </label>
      <label id="top-n-wrap" hidden>Top N <output id="out-topn">10</output>
        <input id="top-n" type="range" min="1" max="40" step="1" value="10" />
      </label>
      <label id="scholar-wrap" hidden>Scholar
        <select id="scholar-select"></select>
      </label>
      <label>Field / topic
        <select id="topic-select">
          <option value="all">All fields</option>
        </select>
      </label>
      <label>Mix grouping
        <select id="mix-by">
          <option value="role">By role</option>
          <option value="tag">By topic</option>
        </select>
      </label>
      <label>Assumed funding
        <input id="funding" type="number" min="0" step="50" value="1000" />
      </label>
      <label class="check">
        <input id="normalised" type="checkbox" />
        Normalised Laplacian
      </label>
    </fieldset>
  </aside>

  <main>
    <header class="topbar">
      <p class="eyebrow" id="status-line">Waiting for corpus</p>
      <dl class="stats" id="corpus-stats"></dl>
    </header>

    <section class="chart-panel">
      <div class="charts">
        <div class="chart-card">
          <div class="chart-wrap"><canvas id="chart-capital"></canvas></div>
        </div>
        <div class="chart-card">
          <div class="chart-wrap"><canvas id="chart-mix"></canvas></div>
        </div>
        <div class="chart-card">
          <div class="chart-wrap"><canvas id="chart-hhi"></canvas></div>
        </div>
        <div class="chart-card">
          <div class="chart-wrap"><canvas id="chart-cite"></canvas></div>
        </div>
        <div class="chart-card">
          <div class="chart-wrap"><canvas id="chart-weights"></canvas></div>
        </div>
        <div class="chart-card">
          <div class="chart-wrap"><canvas id="chart-fmp"></canvas></div>
        </div>
      </div>
    </section>

    <nav class="tabs" id="metric-tabs">
      <button class="tab active" data-cat="portfolio" type="button">Portfolio</button>
      <button class="tab" data-cat="market" type="button">Market</button>
      <button class="tab" data-cat="distribution" type="button">Distribution</button>
      <button class="tab" data-cat="citation" type="button">Citation</button>
      <button class="tab" data-cat="graph" type="button">Graph</button>
    </nav>
    <section id="metrics"></section>
  </main>

  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
