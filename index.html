<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Liberata</title>
  <script>
    (function () {
      var mode = "system";
      try {
        var stored = localStorage.getItem("liberata-theme");
        if (stored === "light" || stored === "dark") mode = stored;
      } catch (e) {}
      var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      var theme = mode === "dark" || (mode === "system" && dark) ? "dark" : "light";
      document.documentElement.dataset.theme = theme;
      document.documentElement.dataset.themeMode = mode;
      document.documentElement.style.colorScheme = theme;
    })();
  </script>
  <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
